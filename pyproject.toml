[project]
name = "pathoshift-crc"
version = "0.1.0"
description = "PathoShift Mini Challenge: robust histopathology image processing pipeline"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "opencv-python>=4.9",
  "scikit-learn>=1.4",
  "scikit-image>=0.22",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "scipy>=1.11",
  "joblib>=1.3",
  "ipykernel>=6.29",
  "tensorflow>=2.16,<2.22",
]

[project.scripts]
pathoshift = "pathoshift.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pathoshift"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
